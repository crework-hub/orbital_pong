<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Orbital Pong — Космические аномалии (ЛР 6)</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1>Космические аномалии</h1>
    <p>Панель администратора Orbital Pong · ЛР 6, вариант 15 · Гакуть М.А., 25-СТ</p>
  </header>

  <section class="card">
    <h2>Новая аномалия</h2>
    <form id="add-form" novalidate>
      <label>Название
        <input name="name" type="text" maxlength="30" placeholder="Например: Дыра Бета" autocomplete="off">
        <span class="err" data-err="name"></span>
      </label>
      <label>Тип
        <select name="type">
          <option value="">— выберите —</option>
          <option value="black">Чёрная дыра (притягивает)</option>
          <option value="white">Белая дыра (отталкивает)</option>
        </select>
        <span class="err" data-err="type"></span>
      </label>
      <div class="row">
        <label>X (0–800)
          <input name="x" type="number" min="0" max="800" step="any" placeholder="400">
          <span class="err" data-err="x"></span>
        </label>
        <label>Y (0–600)
          <input name="y" type="number" min="0" max="600" step="any" placeholder="300">
          <span class="err" data-err="y"></span>
        </label>
        <label>Масса (0.1–1000)
          <input name="mass" type="number" min="0.1" max="1000" step="any" placeholder="10">
          <span class="err" data-err="mass"></span>
        </label>
      </div>
      <button type="submit">Добавить</button>
    </form>
  </section>

  <section class="card">
    <h2>Список аномалий</h2>
    <div class="filters">
      <label class="grow">Поиск по названию
        <input id="f-search" type="search" placeholder="Начните вводить…">
      </label>
      <label>Минимальная масса: <output id="f-mass-val">0.1</output>
        <input id="f-mass" type="range" min="0.1" max="1000" step="0.1" value="0.1">
      </label>
    </div>
    <p id="counter" class="counter"></p>
    <div class="table-wrap">
      <table id="anomalies">
        <thead>
          <tr>
            <th>Название</th>
            <th>Тип</th>
            <th>X</th>
            <th>Y</th>
            <th>Масса</th>
            <th>Действия</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </section>

  <!-- Обычные скрипты, без type="module": страница открывается и через file://, и с сервера -->
  <script src="js/storage.js"></script>
  <script src="js/validate.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
