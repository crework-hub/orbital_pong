; Настройки физики Orbital Pong (ЛР 2).
; Файл читается при старте игры. Если файла нет или значение неверное,
; берётся значение по умолчанию из settings.py.

[physics]
; Гравитационная постоянная чёрной дыры: F = G / (d * d)
gravity = 500
; Масса мяча: ускорение a = F / m (тяжёлый мяч хуже поддаётся притяжению)
ball_mass = 1.0
; Скорость ракеток, пикселей за кадр
paddle_speed = 6
